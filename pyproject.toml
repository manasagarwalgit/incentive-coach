[project]
name = "incentive-coach"
version = "0.1.0"
description = "An AI agent that tells a field sales manager which reps to call at month-end, and drafts an honest, number-backed nudge for every rep."
readme = "README.md"
authors = [
    { name = "Manas Agarwal", email = "manasagarwal3412@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3.0",
    "mcp[cli]>=2.3.0",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
