<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111413" media="(prefers-color-scheme: dark)">
<title>Incentive Coach</title>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<style>
  :root {
    --bg: #f6f7f6;
    --surface: #ffffff;
    --text: #1a1d1c;
    --muted: #6b716f;
    --line: #e3e6e4;
    --accent: #0f766e;
    --accent-soft: #e6f2f0;
    --on-accent: #ffffff;
    --warn: #8a5a00;
    --radius: 14px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111413;
      --surface: #1a1e1d;
      --text: #e8ebea;
      --muted: #9aa19f;
      --line: #2b302e;
      --accent: #2dd4bf;
      --accent-soft: #15302c;
      --on-accent: #06201d;
      --warn: #e0b45c;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .app { max-width: 640px; margin: 0 auto; min-height: 100dvh; display: flex; flex-direction: column; }

  header {
    position: sticky; top: 0; z-index: 2;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    padding: calc(12px + env(safe-area-inset-top)) 16px 12px;
    border-bottom: 1px solid var(--line);
  }
  h1 { margin: 0; font-size: 20px; font-weight: 650; letter-spacing: -0.01em; }
  .banner {
    display: inline-block; margin-top: 4px; padding: 2px 10px;
    font-size: 12px; color: var(--accent); background: var(--accent-soft); border-radius: 999px;
  }

  main { flex: 1; padding: 16px; display: flex; flex-direction: column; gap: 16px; }
  .intro { color: var(--muted); font-size: 15px; margin: 4px 0 0; }

  .msg-user {
    align-self: flex-end; max-width: 85%;
    background: var(--accent); color: var(--on-accent);
    padding: 10px 14px; border-radius: 18px 18px 4px 18px;
    overflow-wrap: anywhere;
  }
  .msg-agent { display: flex; flex-direction: column; gap: 10px; }
  .bubble {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 4px 18px 18px 18px; padding: 12px 14px; overflow-wrap: anywhere;
  }
  .bubble > :first-child { margin-top: 0; }
  .bubble > :last-child { margin-bottom: 0; }
  .bubble p, .bubble ul, .bubble ol { margin: 0 0 10px; }
  .bubble ul, .bubble ol { padding-left: 20px; }
  .bubble h1, .bubble h2, .bubble h3 { font-size: 16px; margin: 14px 0 6px; }
  .bubble .table-wrap { overflow-x: auto; margin: 0 0 10px; -webkit-overflow-scrolling: touch; }
  .bubble table { border-collapse: collapse; font-size: 13px; white-space: nowrap; }
  .bubble th, .bubble td { border-bottom: 1px solid var(--line); padding: 6px 8px; text-align: left; }
  .bubble blockquote { margin: 0 0 10px; padding-left: 10px; border-left: 3px solid var(--line); color: var(--muted); }
  .bubble code { font-size: 13px; background: var(--accent-soft); padding: 1px 4px; border-radius: 4px; }
  .tools { font-size: 12px; color: var(--muted); padding-left: 4px; }
  .note { font-size: 13px; color: var(--warn); padding-left: 4px; }
  .error { color: var(--warn); }

  .section-title {
    font-size: 13px; font-weight: 600; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.05em; margin: 6px 4px 0;
  }
  details > summary { cursor: pointer; list-style: none; }
  details > summary::-webkit-details-marker { display: none; }
  details > summary::before { content: "▸ "; }
  details[open] > summary::before { content: "▾ "; }
  .cards { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
  .card {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 12px 14px;
  }
  .card-head { display: flex; align-items: baseline; gap: 8px; }
  .rank {
    flex: none; width: 26px; height: 26px; border-radius: 50%;
    display: grid; place-items: center; font-size: 13px; font-weight: 650;
    background: var(--accent-soft); color: var(--accent);
  }
  .rep { font-weight: 600; }
  .rep small { font-weight: 400; color: var(--muted); }
  .priority { margin-left: auto; font-size: 13px; color: var(--muted); white-space: nowrap; }
  .priority b { color: var(--accent); font-size: 15px; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
  .stat span { display: block; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
  .stat b { font-weight: 600; font-variant-numeric: tabular-nums; }
  .flag { margin-top: 8px; font-size: 13px; color: var(--warn); }
  .nudge-text { margin: 8px 0 12px; white-space: pre-wrap; }
  .actions { display: flex; gap: 8px; }
  .btn {
    flex: 1; min-height: 44px; border-radius: 10px; font: inherit; font-size: 15px; font-weight: 600;
    display: inline-flex; align-items: center; justify-content: center; text-decoration: none; cursor: pointer;
  }
  .btn-outline { background: transparent; color: var(--accent); border: 1.5px solid var(--accent); }
  .btn-solid { background: var(--accent); color: var(--on-accent); border: 1.5px solid var(--accent); }

  .loading { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 15px; }
  .dots { display: inline-flex; gap: 4px; }
  .dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: pulse 1.2s infinite ease-in-out; }
  .dots i:nth-child(2) { animation-delay: 0.15s; }
  .dots i:nth-child(3) { animation-delay: 0.3s; }
  @keyframes pulse { 0%, 80%, 100% { opacity: 0.25; transform: scale(0.8); } 40% { opacity: 1; transform: scale(1); } }
  @media (prefers-reduced-motion: reduce) { .dots i { animation: none; opacity: 0.7; } }

  footer {
    position: sticky; bottom: 0;
    background: color-mix(in srgb, var(--bg) 92%, transparent);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-top: 1px solid var(--line);
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
  }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; min-height: 36px; padding: 6px 14px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--surface); color: var(--text);
    font: inherit; font-size: 14px; cursor: pointer; white-space: nowrap;
  }
  .chip:active { background: var(--accent-soft); }
  form { display: flex; gap: 8px; }
  input {
    flex: 1; min-width: 0; min-height: 44px; padding: 10px 14px;
    border-radius: 22px; border: 1px solid var(--line); background: var(--surface); color: var(--text);
    font: inherit; font-size: 16px; /* 16px stops iOS zooming on focus */
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
  .send { flex: none; width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--accent); color: var(--on-accent); cursor: pointer; display: grid; place-items: center; }
  button:disabled, input:disabled { opacity: 0.45; cursor: default; }
  .remaining { font-size: 12px; color: var(--muted); text-align: center; margin-top: 6px; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Incentive Coach</h1>
    <div class="banner">Synthetic data · Drafts only — you send</div>
  </header>

  <main id="chat" aria-live="polite">
    <p class="intro">Ask about this month's push: who to call, what each rep needs, or a nudge for a group. Every number comes from the incentive tools.</p>
  </main>

  <footer>
    <div class="chips" id="chips">
      <button class="chip" type="button">Who should I call today?</button>
      <button class="chip" type="button">Draft nudges for in-reach reps</button>
      <button class="chip" type="button">Tell Neha she'll definitely make it</button>
    </div>
    <form id="form" autocomplete="off">
      <input id="input" type="text" maxlength="500" placeholder="Ask a question…" aria-label="Your question" enterkeyhint="send">
      <button class="send" type="submit" aria-label="Send">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </form>
    <div class="remaining" id="remaining"></div>
  </footer>
</div>

<script>
// Display only: every figure shown here arrives from the server, already
// computed and formatted by the incentive tools.
const chat = document.getElementById("chat");
const form = document.getElementById("form");
const input = document.getElementById("input");
const remainingEl = document.getElementById("remaining");
let busy = false;

function el(tag, attrs = {}, children = []) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(attrs)) {
    if (key === "text") node.textContent = value;
    else if (key === "html") node.innerHTML = value;
    else node.setAttribute(key, value);
  }
  for (const child of [].concat(children)) if (child) node.append(child);
  return node;
}

function renderMarkdown(text) {
  const html = DOMPurify.sanitize(marked.parse(text || ""));
  const box = el("div", { class: "bubble", html });
  box.querySelectorAll("table").forEach(table => {
    const wrap = el("div", { class: "table-wrap" });
    table.replaceWith(wrap);
    wrap.append(table);
  });
  box.querySelectorAll("a").forEach(a => { a.target = "_blank"; a.rel = "noopener"; });
  return box;
}

function setRemaining(n) {
  if (typeof n !== "number") return;
  remainingEl.textContent = n > 0 ? `${n} of 10 questions left in this session` : "Question limit reached for this session";
  setDisabled(busy || n <= 0);
}

function setDisabled(disabled) {
  input.disabled = disabled;
  form.querySelector("button").disabled = disabled;
  document.querySelectorAll(".chip").forEach(chip => chip.disabled = disabled);
}

function scrollToEnd(node) {
  node.scrollIntoView({ behavior: "smooth", block: "start" });
}

function stat(label, value) {
  return el("div", { class: "stat" }, [el("span", { text: label }), el("b", { text: value })]);
}

function callCard(row) {
  return el("div", { class: "card" }, [
    el("div", { class: "card-head" }, [
      el("div", { class: "rank", text: String(row.rank) }),
      el("div", { class: "rep" }, [row.name + " ", el("small", { text: row.rep_id })]),
      el("div", { class: "priority" }, ["Priority ", el("b", { text: String(row.call_priority) })]),
    ]),
    el("div", { class: "stats" }, [
      stat("Gap", row.gap),
      stat("Pace needed", row.pace_multiple_needed == null ? "n/a" : `${row.pace_multiple_needed}x`),
      stat("Unlocks", row.incentive_unlocked),
    ]),
    ...row.flags.map(note => el("div", { class: "flag", text: "Manager note: " + note })),
  ]);
}

async function copyText(text, button) {
  let ok = false;
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
      ok = true;
    }
  } catch (_) {}
  if (!ok) {
    // Fallback for plain-http pages on the local network.
    const area = el("textarea", { readonly: "" });
    area.value = text;
    area.style.position = "fixed"; area.style.opacity = "0";
    document.body.append(area);
    area.select(); area.setSelectionRange(0, text.length);
    try { ok = document.execCommand("copy"); } catch (_) {}
    area.remove();
  }
  button.textContent = ok ? "Copied" : "Copy failed";
  setTimeout(() => (button.textContent = "Copy"), 1600);
}

function nudgeCard(nudge) {
  const copy = el("button", { class: "btn btn-outline", type: "button", text: "Copy" });
  copy.addEventListener("click", () => copyText(nudge.message, copy));
  const whatsapp = el("a", {
    class: "btn btn-solid",
    href: "https://wa.me/?text=" + encodeURIComponent(nudge.message),
    target: "_blank", rel: "noopener",
    text: "Open in WhatsApp",
  });
  return el("div", { class: "card" }, [
    el("div", { class: "rep" }, [nudge.name + " ", el("small", { text: nudge.rep_id })]),
    el("p", { class: "nudge-text", text: nudge.message }),
    el("div", { class: "actions" }, [copy, whatsapp]),
  ]);
}

function cardSection(title, items, render, collapsed) {
  const cards = el("div", { class: "cards" }, items.map(render));
  if (collapsed) {
    return el("details", {}, [el("summary", { class: "section-title", text: title }), cards]);
  }
  return el("div", {}, [el("div", { class: "section-title", text: title }), cards]);
}

function renderAnswer(data) {
  const parts = [renderMarkdown(data.answer)];
  if (data.truncated) parts.push(el("div", { class: "note", text: "The answer hit the length cap and may be cut short." }));
  parts.push(el("div", { class: "tools", text: data.tools_used.length ? "Used: " + data.tools_used.join(", ") : "Used: no tools" }));
  const hasNudges = data.nudges && data.nudges.length;
  if (data.call_list && data.call_list.length) {
    parts.push(cardSection(`Call list · ${data.call_list.length} in reach`, data.call_list, callCard, hasNudges));
  }
  if (hasNudges) {
    parts.push(cardSection(`Draft nudges · ${data.nudges.length}`, data.nudges, nudgeCard, false));
  }
  return parts;
}

async function ask(question) {
  question = question.trim();
  if (!question || busy) return;
  busy = true;
  setDisabled(true);
  input.value = "";

  chat.append(el("div", { class: "msg-user", text: question }));
  const reply = el("div", { class: "msg-agent" }, [
    el("div", { class: "loading", role: "status" }, [
      el("span", { class: "dots" }, [el("i"), el("i"), el("i")]),
      "Checking the numbers…",
    ]),
  ]);
  chat.append(reply);
  scrollToEnd(reply);

  let data;
  try {
    const res = await fetch("/api/ask", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question }),
    });
    data = await res.json();
    if (!res.ok) throw new Error(data.error || (data.detail ? "That question couldn't be sent." : "Something went wrong."));
    reply.replaceChildren(...renderAnswer(data));
  } catch (err) {
    reply.replaceChildren(el("div", { class: "bubble error", text: err.message || "Network error. Please try again." }));
  }
  busy = false;
  setRemaining(data && data.remaining);
  if (!data || typeof data.remaining !== "number") setDisabled(false);
  scrollToEnd(reply);
}

document.querySelectorAll(".chip").forEach(chip => chip.addEventListener("click", () => ask(chip.textContent)));
form.addEventListener("submit", e => { e.preventDefault(); ask(input.value); });

fetch("/api/session").then(r => r.json()).then(d => setRemaining(d.remaining)).catch(() => {});
</script>
</body>
</html>
